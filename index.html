<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Jinboard — 개인 목표 관리</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-0: #0a0a0a;
    --bg-1: #0f0f0f;
    --bg-2: #141414;
    --bg-3: #1a1a1a;
    --bg-hover: #1e1e1e;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.12);
    --border-accent: rgba(139,92,246,0.35);
    --text-1: #f4f4f5;
    --text-2: #a1a1aa;
    --text-3: #71717a;
    --text-4: #52525b;
    --accent: #8b5cf6;
    --accent-2: #6366f1;
    --accent-soft: rgba(139,92,246,0.12);
    --accent-glow: rgba(139,92,246,0.25);
    --green: #10b981;
    --amber: #f59e0b;
    --red: #ef4444;
    --blue: #3b82f6;
    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
    --radius-xl: 20px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-0);
    color: var(--text-1);
    font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-feature-settings: "cv11", "ss01", "ss03";
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body {
    background:
      radial-gradient(1200px 600px at 70% -10%, rgba(139,92,246,0.08), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(99,102,241,0.05), transparent 60%),
      var(--bg-0);
    min-height: 100vh;
  }
  button { font-family: inherit; }
  ::selection { background: var(--accent-soft); color: var(--text-1); }

  /* App layout */
  .app {
    max-width: 1280px;
    margin: 0 auto;
    padding: 32px 40px 80px;
  }

  /* Header */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .brand-mark {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    position: relative;
    box-shadow: 0 0 0 1px rgba(139,92,246,0.4), 0 4px 12px rgba(139,92,246,0.25);
  }
  .brand-mark::after {
    content: "";
    position: absolute; inset: 6px;
    border-radius: 3px;
    background: rgba(0,0,0,0.35);
    border: 1.5px solid rgba(255,255,255,0.9);
    border-right-color: transparent;
    border-bottom-color: transparent;
  }
  .brand-name { font-size: 15px; }
  .date-pill {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 12px;
    color: var(--text-2);
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--bg-1);
  }
  .date-pill .dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--green);
    border-radius: 999px;
    margin-right: 8px;
    box-shadow: 0 0 8px var(--green);
    vertical-align: middle;
  }

  /* Tabs */
  .tabs {
    display: inline-flex;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    gap: 2px;
    margin-bottom: 32px;
    position: relative;
  }
  .tab {
    border: 0;
    background: transparent;
    color: var(--text-3);
    padding: 8px 16px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.005em;
    transition: color 0.18s ease;
    display: flex; align-items: center; gap: 8px;
  }
  .tab:hover { color: var(--text-1); }
  .tab.active {
    color: var(--text-1);
    background: var(--bg-3);
    box-shadow:
      0 0 0 1px var(--border-strong),
      0 1px 0 rgba(255,255,255,0.04) inset,
      0 4px 10px rgba(0,0,0,0.4);
  }
  .tab .tab-num {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 10.5px;
    color: var(--text-4);
    padding: 1px 5px;
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .tab.active .tab-num { color: var(--accent); border-color: var(--border-accent); background: var(--accent-soft); }

  /* Panels */
  .panel-enter {
    animation: panelIn 0.32s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  @keyframes panelIn {
    0% { opacity: 0; transform: translateY(6px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* Card primitive */
  .card {
    background:
      linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0)) ,
      var(--bg-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent 30%);
  }
  .card-pad { padding: 20px; }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-3);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }
  .card-title .dot-purple {
    width: 6px; height: 6px; background: var(--accent); border-radius: 999px;
    box-shadow: 0 0 8px var(--accent-glow);
  }

  /* HERO weekly summary */
  .hero {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  .hero-main {
    padding: 28px;
    background:
      radial-gradient(600px 200px at 100% 0%, rgba(139,92,246,0.12), transparent 60%),
      linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0)),
      var(--bg-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    position: relative;
    overflow: hidden;
  }
  .hero-main::after {
    content: "";
    position: absolute; right: -40px; top: -40px;
    width: 220px; height: 220px;
    background: radial-gradient(closest-side, var(--accent-glow), transparent 70%);
    filter: blur(20px);
    pointer-events: none;
  }
  .hero-eyebrow {
    font-size: 12px;
    color: var(--text-3);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .hero-eyebrow .week-chip {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 10.5px;
    padding: 2px 7px;
    border: 1px solid var(--border-accent);
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 4px;
    text-transform: none;
    letter-spacing: 0;
  }
  .hero-number {
    font-size: 72px;
    font-weight: 600;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--text-1);
    display: flex; align-items: baseline; gap: 14px;
    font-feature-settings: "tnum";
  }
  .hero-number .pct { font-size: 28px; color: var(--text-3); font-weight: 500; }
  .hero-number .delta {
    font-size: 13px;
    color: var(--green);
    font-weight: 500;
    padding: 4px 9px;
    background: rgba(16,185,129,0.1);
    border: 1px solid rgba(16,185,129,0.2);
    border-radius: 999px;
    font-family: "Geist Mono", ui-monospace, monospace;
  }
  .hero-sub {
    margin-top: 14px;
    font-size: 13px;
    color: var(--text-3);
  }
  .hero-bar {
    margin-top: 22px;
    height: 8px;
    background: var(--bg-3);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
    border: 1px solid var(--border);
  }
  .hero-bar-fill {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    border-radius: 999px;
    transition: width 1.2s cubic-bezier(0.2, 0.7, 0.2, 1);
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .hero-labels {
    margin-top: 10px;
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--text-4);
    font-family: "Geist Mono", ui-monospace, monospace;
  }

  /* Hero side stats */
  .hero-side {
    display: grid;
    grid-template-rows: 1fr 1fr;
    gap: 12px;
  }
  .stat-card {
    padding: 18px 20px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .stat-label {
    font-size: 12px; color: var(--text-3);
    letter-spacing: 0.02em; text-transform: uppercase;
  }
  .stat-value {
    font-size: 28px; font-weight: 600;
    letter-spacing: -0.02em;
    font-feature-settings: "tnum";
  }
  .stat-value .unit { font-size: 14px; color: var(--text-3); margin-left: 4px; font-weight: 500; }
  .stat-spark {
    height: 24px;
    display: flex; align-items: flex-end; gap: 3px;
  }
  .spark-bar {
    flex: 1;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    border-radius: 2px;
    opacity: 0.7;
    min-height: 4px;
  }

  /* Goals row */
  .goals-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }
  .goal-card {
    padding: 22px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0)),
      var(--bg-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    position: relative;
    overflow: hidden;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .goal-card:hover {
    border-color: var(--border-strong);
    transform: translateY(-1px);
  }
  .goal-card .accent-bar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.6;
  }
  .goal-head {
    display: flex; gap: 16px;
    margin-bottom: 18px;
  }
  .goal-meta { flex: 1; min-width: 0; }
  .goal-cat {
    font-size: 10.5px;
    font-family: "Geist Mono", ui-monospace, monospace;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .goal-name {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.015em;
    color: var(--text-1);
    line-height: 1.3;
  }
  .ring-wrap {
    position: relative;
    width: 64px; height: 64px;
    flex-shrink: 0;
  }
  .ring-wrap svg {
    transform: rotate(-90deg);
    width: 100%; height: 100%;
  }
  .ring-bg { fill: none; stroke: var(--bg-3); stroke-width: 6; }
  .ring-fg {
    fill: none;
    stroke: url(#ringGrad);
    stroke-width: 6;
    stroke-linecap: round;
    transition: stroke-dashoffset 1.4s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .ring-label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600;
    letter-spacing: -0.02em;
    font-feature-settings: "tnum";
  }
  .ring-label .pct { font-size: 9.5px; color: var(--text-3); margin-left: 1px; }

  .milestone-current {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
  }
  .milestone-label {
    font-size: 10.5px;
    color: var(--text-4);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .ms-status-dot {
    width: 6px; height: 6px; border-radius: 999px;
    background: var(--amber);
    box-shadow: 0 0 6px rgba(245,158,11,0.6);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .milestone-name {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-1);
    margin-bottom: 8px;
    display: flex; justify-content: space-between; gap: 8px;
  }
  .milestone-name .kpi {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 12px;
    color: var(--text-2);
  }
  .mini-bar {
    height: 4px;
    background: var(--bg-3);
    border-radius: 999px;
    overflow: hidden;
  }
  .mini-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    border-radius: 999px;
    transition: width 1.2s cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  /* Bottom row */
  .bottom-row {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 16px;
  }

  /* Checklist */
  .checklist { display: flex; flex-direction: column; }
  .check-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease;
    margin: 0 -6px;
  }
  .check-item:hover { background: var(--bg-2); }
  .check-box {
    width: 18px; height: 18px;
    border: 1.5px solid var(--border-strong);
    border-radius: 5px;
    flex-shrink: 0;
    background: var(--bg-2);
    position: relative;
    transition: all 0.18s ease;
  }
  .check-item.done .check-box {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    border-color: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
  }
  .check-item.done .check-box::after {
    content: "";
    position: absolute;
    left: 5px; top: 2px;
    width: 5px; height: 9px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .check-text {
    flex: 1;
    font-size: 13.5px;
    color: var(--text-1);
    transition: color 0.18s ease, text-decoration-color 0.18s ease;
  }
  .check-item.done .check-text {
    color: var(--text-4);
    text-decoration: line-through;
    text-decoration-color: var(--text-4);
  }
  .check-tag {
    font-size: 10.5px;
    font-family: "Geist Mono", ui-monospace, monospace;
    color: var(--text-3);
    padding: 2px 7px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg-2);
  }
  .check-tag.tag-purple { color: var(--accent); border-color: var(--border-accent); background: var(--accent-soft); }
  .check-tag.tag-blue { color: var(--blue); border-color: rgba(59,130,246,0.25); background: rgba(59,130,246,0.08); }
  .check-tag.tag-amber { color: var(--amber); border-color: rgba(245,158,11,0.25); background: rgba(245,158,11,0.08); }

  /* Eisenhower mini */
  .eisen-mini {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 8px;
  }
  .quad {
    padding: 12px 12px 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    min-height: 96px;
    display: flex; flex-direction: column;
    transition: border-color 0.18s ease, background 0.18s ease;
  }
  .quad:hover { border-color: var(--border-strong); background: var(--bg-3); }
  .quad-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .quad-label {
    font-size: 10.5px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: flex; align-items: center; gap: 6px;
  }
  .quad-label .qdot { width: 5px; height: 5px; border-radius: 999px; }
  .qdot.q1 { background: var(--red); box-shadow: 0 0 6px rgba(239,68,68,0.6); }
  .qdot.q2 { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
  .qdot.q3 { background: var(--amber); }
  .qdot.q4 { background: var(--text-4); }
  .quad-count {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--text-3);
  }
  .quad-tags {
    display: flex; flex-wrap: wrap; gap: 4px;
  }
  .qtag {
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    color: var(--text-2);
    white-space: nowrap;
  }

  /* TAB 2: Goal management */
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .section-title {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .section-sub { color: var(--text-3); font-size: 13px; margin-top: 2px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    background: var(--accent);
    color: white;
    border: 0;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.18s ease, background 0.18s ease;
    box-shadow:
      0 0 0 1px rgba(139,92,246,0.5),
      0 4px 12px rgba(139,92,246,0.3),
      inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .btn:hover { background: #9d6dff; }
  .btn:active { transform: translateY(1px); }
  .btn-ghost {
    background: var(--bg-2);
    color: var(--text-2);
    box-shadow: 0 0 0 1px var(--border);
  }
  .btn-ghost:hover { background: var(--bg-3); color: var(--text-1); }

  .goal-row-list {
    display: flex; flex-direction: column;
    gap: 12px;
  }
  .goal-expand {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    transition: border-color 0.2s ease;
  }
  .goal-expand:hover { border-color: var(--border-strong); }
  .goal-expand.open { border-color: var(--border-accent); }
  .goal-expand-head {
    display: grid;
    grid-template-columns: auto 1fr auto auto auto;
    gap: 18px;
    padding: 18px 22px;
    cursor: pointer;
    align-items: center;
  }
  .goal-expand-head:hover { background: var(--bg-2); }
  .chevron {
    width: 18px; height: 18px;
    color: var(--text-3);
    transition: transform 0.25s ease;
  }
  .goal-expand.open .chevron { transform: rotate(90deg); color: var(--accent); }
  .goal-expand-meta { min-width: 0; }
  .goal-expand-cat {
    font-size: 10.5px;
    font-family: "Geist Mono", ui-monospace, monospace;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .goal-expand-name {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-top: 2px;
  }
  .goal-expand-progress {
    width: 180px;
    display: flex; align-items: center; gap: 10px;
  }
  .goal-expand-progress .bar {
    flex: 1; height: 5px;
    background: var(--bg-3);
    border-radius: 999px;
    overflow: hidden;
  }
  .goal-expand-progress .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    border-radius: 999px;
    transition: width 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .goal-expand-progress .pct-num {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-1);
    min-width: 38px;
    text-align: right;
  }
  .goal-expand-counter {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 11.5px;
    color: var(--text-3);
    padding: 4px 9px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-2);
  }

  .goal-expand-body {
    border-top: 1px solid var(--border);
    padding: 26px 28px 28px;
    background:
      linear-gradient(180deg, rgba(139,92,246,0.025), transparent 30%),
      var(--bg-1);
    display: none;
  }
  .goal-expand.open .goal-expand-body { display: block; animation: bodyIn 0.3s cubic-bezier(0.2, 0.7, 0.2, 1); }
  @keyframes bodyIn {
    0% { opacity: 0; transform: translateY(-4px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* Timeline */
  .timeline {
    position: relative;
    padding-left: 0;
  }
  .timeline-track {
    position: absolute;
    left: 11px; top: 12px; bottom: 12px;
    width: 1.5px;
    background: linear-gradient(180deg, var(--accent), var(--border) 60%, var(--border));
  }
  .ts-item {
    position: relative;
    padding: 0 0 22px 36px;
  }
  .ts-item:last-child { padding-bottom: 0; }
  .ts-node {
    position: absolute;
    left: 4px; top: 4px;
    width: 16px; height: 16px;
    border-radius: 999px;
    background: var(--bg-1);
    border: 2px solid var(--text-4);
    display: flex; align-items: center; justify-content: center;
  }
  .ts-item.done .ts-node {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .ts-item.done .ts-node::after {
    content: "";
    width: 4px; height: 7px;
    border: solid white;
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }
  .ts-item.active .ts-node {
    background: var(--bg-1);
    border-color: var(--amber);
    box-shadow: 0 0 0 4px rgba(245,158,11,0.15);
  }
  .ts-item.active .ts-node::after {
    content: "";
    width: 6px; height: 6px;
    border-radius: 999px;
    background: var(--amber);
    box-shadow: 0 0 8px rgba(245,158,11,0.7);
    animation: pulse 1.8s ease-in-out infinite;
  }

  .ts-row {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px;
    margin-bottom: 6px;
  }
  .ts-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-1);
  }
  .ts-item.done .ts-title { color: var(--text-3); }
  .ts-badge {
    font-size: 10.5px;
    font-family: "Geist Mono", ui-monospace, monospace;
    padding: 2px 7px;
    border-radius: 4px;
    border: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .ts-badge.done {
    color: var(--green);
    background: rgba(16,185,129,0.08);
    border-color: rgba(16,185,129,0.2);
  }
  .ts-badge.active {
    color: var(--amber);
    background: rgba(245,158,11,0.08);
    border-color: rgba(245,158,11,0.2);
  }
  .ts-badge.todo {
    color: var(--text-3);
  }

  .kpi-block {
    margin-top: 8px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .kpi-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 8px;
  }
  .kpi-label {
    font-size: 11.5px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .kpi-value {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-1);
  }
  .kpi-value .target { color: var(--text-3); font-weight: 400; }
  .kpi-bar {
    height: 5px;
    background: var(--bg-3);
    border-radius: 999px;
    overflow: hidden;
  }
  .kpi-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    border-radius: 999px;
    transition: width 1.1s cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  /* TAB 3: Tasks */
  .tasks-grid {
    display: grid;
    grid-template-columns: 1fr 1.6fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  /* Calendar */
  .cal-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-month {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .cal-nav {
    display: flex; gap: 4px;
  }
  .cal-nav button {
    width: 26px; height: 26px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .cal-nav button:hover { background: var(--bg-3); color: var(--text-1); }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .cal-head-cell {
    text-align: center;
    font-size: 10.5px;
    color: var(--text-4);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 6px 0;
    font-family: "Geist Mono", ui-monospace, monospace;
  }
  .cal-cell {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    color: var(--text-2);
    border-radius: 6px;
    cursor: pointer;
    position: relative;
    transition: background 0.15s ease, color 0.15s ease;
    font-family: "Geist Mono", ui-monospace, monospace;
  }
  .cal-cell:hover { background: var(--bg-2); color: var(--text-1); }
  .cal-cell.muted { color: var(--text-4); }
  .cal-cell.today {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    font-weight: 600;
    box-shadow: 0 0 0 1px var(--accent), 0 0 12px var(--accent-glow);
  }
  .cal-cell.has-event::after {
    content: "";
    position: absolute;
    bottom: 4px; left: 50%;
    transform: translateX(-50%);
    width: 3px; height: 3px;
    background: var(--accent);
    border-radius: 999px;
  }
  .cal-cell.in-week:not(.today) {
    background: rgba(139,92,246,0.06);
    color: var(--text-1);
  }

  /* Eisenhower full */
  .eisen-full {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 12px;
    height: 100%;
  }
  .eisen-quad {
    padding: 16px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex; flex-direction: column;
    gap: 10px;
    min-height: 160px;
    transition: border-color 0.2s ease;
  }
  .eisen-quad:hover { border-color: var(--border-strong); }
  .eq-head {
    display: flex; align-items: center; justify-content: space-between;
  }
  .eq-title {
    font-size: 12px;
    color: var(--text-1);
    font-weight: 500;
    letter-spacing: -0.005em;
    display: flex; align-items: center; gap: 8px;
  }
  .eq-title .qd {
    width: 8px; height: 8px; border-radius: 999px;
  }
  .qd.q1 { background: var(--red); box-shadow: 0 0 8px rgba(239,68,68,0.5); }
  .qd.q2 { background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
  .qd.q3 { background: var(--amber); }
  .qd.q4 { background: var(--text-4); }
  .eq-sub { font-size: 10.5px; color: var(--text-4); margin-top: 1px; }
  .eq-tasks {
    display: flex; flex-direction: column; gap: 6px;
    flex: 1;
  }
  .eq-task {
    font-size: 12.5px;
    padding: 7px 10px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-1);
    display: flex; align-items: center; gap: 8px;
    transition: background 0.15s ease;
    cursor: default;
  }
  .eq-task:hover { background: var(--bg-3); }
  .eq-dot {
    width: 5px; height: 5px; border-radius: 999px;
    flex-shrink: 0;
  }
  .eq-task .dot-purple { background: var(--accent); }
  .eq-task .dot-blue { background: var(--blue); }
  .eq-task .dot-amber { background: var(--amber); }
  .eq-task .dot-green { background: var(--green); }
  .eq-task .dot-gray { background: var(--text-4); }
  .eq-tag-mini {
    margin-left: auto;
    font-size: 10px;
    font-family: "Geist Mono", ui-monospace, monospace;
    color: var(--text-4);
  }
  .eq-empty {
    font-size: 11.5px;
    color: var(--text-4);
    font-style: italic;
    padding: 8px 0;
  }

  /* Today detail */
  .today-detail {
    padding: 22px 24px 24px;
  }
  .today-rows {
    display: flex; flex-direction: column;
    gap: 4px;
  }
  .today-row {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    gap: 12px;
    align-items: center;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .today-row:hover { background: var(--bg-2); }
  .today-row .check-box { width: 16px; height: 16px; border-radius: 4px; }
  .today-row.done .check-box {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: var(--accent);
  }
  .today-row.done .check-box::after {
    content: "";
    position: absolute;
    left: 4px; top: 1px;
    width: 4px; height: 8px;
    border: solid white;
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg);
  }
  .today-text {
    font-size: 13.5px;
    color: var(--text-1);
  }
  .today-row.done .today-text {
    color: var(--text-4);
    text-decoration: line-through;
  }
  .today-quad-tag {
    font-size: 10.5px;
    font-family: "Geist Mono", ui-monospace, monospace;
    color: var(--text-3);
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    display: flex; align-items: center; gap: 5px;
  }
  .today-row:hover .today-quad-tag { background: var(--bg-3); }
  .today-quad-tag .qd { width: 5px; height: 5px; border-radius: 999px; }
  .today-time {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 11.5px;
    color: var(--text-3);
  }

  /* Footer kbd hints */
  .kbd-hints {
    display: flex; gap: 16px; align-items: center;
    margin-top: 28px;
    padding: 12px 16px;
    color: var(--text-4);
    font-size: 11.5px;
    border-top: 1px solid var(--border);
  }
  .kbd {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 10.5px;
    padding: 2px 6px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 4px;
    color: var(--text-2);
  }

  /* Mini stats strip */
  .stats-mini-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .smp {
    flex: 1; padding: 13px 14px;
    background: var(--bg-1); border: 1px solid var(--border);
    border-radius: var(--radius); display: flex; align-items: center; gap: 10px;
    transition: border-color 0.18s ease;
  }
  .smp:hover { border-color: var(--border-strong); }
  .smp-icon { font-size: 18px; line-height: 1; }
  .smp-body { flex: 1; min-width: 0; }
  .smp-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .smp-label { font-size: 10.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.04em; }
  .smp-lv { font-family: "Geist Mono", ui-monospace, monospace; font-size: 12px; font-weight: 600; color: var(--accent); }
  .smp-bar { height: 3px; background: var(--bg-3); border-radius: 999px; overflow: hidden; }
  .smp-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: 999px; transition: width 1s cubic-bezier(0.2,0.7,0.2,1); }

  /* Retro tab */
  .retro-editor {
    background: var(--bg-1); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 24px; margin-bottom: 16px;
  }
  .retro-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 16px; }
  .retro-field { display: flex; flex-direction: column; gap: 8px; }
  .retro-field-label {
    font-size: 11px; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.05em;
    display: flex; align-items: center; gap: 6px;
  }
  .retro-textarea {
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text-1);
    font-family: inherit; font-size: 13px; line-height: 1.6;
    padding: 12px; resize: vertical; min-height: 100px;
    transition: border-color 0.18s ease;
  }
  .retro-textarea:focus { outline: none; border-color: var(--border-accent); }
  .retro-textarea::placeholder { color: var(--text-4); }
  .retro-history { display: flex; flex-direction: column; gap: 10px; }
  .retro-card {
    background: var(--bg-1); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 20px;
    transition: border-color 0.18s ease;
  }
  .retro-card:hover { border-color: var(--border-strong); }
  .retro-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .retro-week-label { font-family: "Geist Mono", ui-monospace, monospace; font-size: 12px; font-weight: 600; color: var(--accent); }
  .retro-cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .retro-col-title { font-size: 10px; color: var(--text-4); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .retro-col-text { font-size: 12.5px; color: var(--text-2); line-height: 1.5; }

  /* Vision tab */
  .vision-mission {
    padding: 28px 32px;
    background: radial-gradient(800px 300px at 60% -20%, rgba(139,92,246,0.1), transparent 60%), var(--bg-1);
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    margin-bottom: 20px; position: relative; overflow: hidden;
  }
  .vision-mission-label {
    font-size: 11px; color: var(--text-3); text-transform: uppercase;
    letter-spacing: 0.06em; margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .vision-mission-input {
    font-size: 20px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.4;
    color: var(--text-1); background: transparent; border: none;
    border-bottom: 1px dashed var(--border-accent);
    width: 100%; font-family: inherit; padding: 0 0 4px; outline: none;
  }
  .vision-mission-input::placeholder { color: var(--text-4); font-weight: 400; }
  .char-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
  .char-card {
    background: var(--bg-1); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 20px 14px; text-align: center;
    position: relative; overflow: hidden;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }
  .char-card:hover { border-color: var(--border-accent); transform: translateY(-2px); }
  .char-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.5;
  }
  .char-icon { font-size: 22px; margin-bottom: 8px; }
  .char-label { font-size: 10.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; }
  .char-level { font-size: 38px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; color: var(--text-1); font-feature-settings: "tnum"; }
  .char-level-lbl { font-size: 9.5px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; margin: 4px 0 12px; font-family: "Geist Mono", ui-monospace, monospace; }
  .char-xp-bar { height: 4px; background: var(--bg-3); border-radius: 999px; overflow: hidden; margin-bottom: 5px; }
  .char-xp-fill { height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: 999px; transition: width 1.2s cubic-bezier(0.2,0.7,0.2,1); }
  .char-xp-text { font-family: "Geist Mono", ui-monospace, monospace; font-size: 10px; color: var(--text-4); }
  .char-input-lbl { font-size: 10px; color: var(--text-4); margin: 10px 0 4px; }
  .char-input {
    width: 100%; text-align: center; background: var(--bg-2);
    border: 1px solid var(--border); border-radius: 6px; color: var(--text-1);
    font-family: "Geist Mono", ui-monospace, monospace; font-size: 12px;
    padding: 5px 8px; outline: none; transition: border-color 0.18s ease;
  }
  .char-input:focus { border-color: var(--border-accent); }
  .big-timeline { background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; }
  .bigt-track { display: flex; align-items: flex-start; gap: 0; overflow-x: auto; padding-bottom: 8px; }
  .bigt-year { flex-shrink: 0; min-width: 160px; padding: 0 20px 0 0; position: relative; }
  .bigt-year::after { content: ""; position: absolute; right: 10px; top: 18px; bottom: 0; width: 1px; background: var(--border); }
  .bigt-year:last-child::after { display: none; }
  .bigt-year-label {
    font-family: "Geist Mono", ui-monospace, monospace; font-size: 13px; font-weight: 600;
    color: var(--text-3); margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  }
  .bigt-year.current .bigt-year-label { color: var(--accent); }
  .bigt-ydot { width: 8px; height: 8px; border-radius: 999px; background: var(--border); flex-shrink: 0; }
  .bigt-year.current .bigt-ydot { background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
  .bigt-items { display: flex; flex-direction: column; gap: 6px; }
  .bigt-item { font-size: 11.5px; padding: 5px 9px; border-radius: 5px; color: var(--text-2); border: 1px solid var(--border); background: var(--bg-2); }
  .bigt-item.done { color: var(--text-4); text-decoration: line-through; }
  .bigt-item.active { color: var(--accent); border-color: var(--border-accent); background: var(--accent-soft); }
  .bigt-item.future { color: var(--text-3); border-style: dashed; background: transparent; }

  /* Add goal button card */
  .add-goal-card {
    padding: 18px 22px;
    background: var(--bg-1);
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius-lg);
    display: flex; align-items: center; gap: 12px;
    justify-content: center;
    cursor: pointer;
    color: var(--text-3);
    font-size: 13.5px;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .add-goal-card:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  .plus {
    width: 18px; height: 18px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px;
    border: 1px solid currentColor;
    font-size: 14px; line-height: 1;
  }

  /* Radar + stat panel */
  .stat-panel { display: grid; grid-template-columns: 220px 1fr; gap: 28px; align-items: center; background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px 24px; margin-bottom: 24px; }
  .stat-list { display: flex; flex-direction: column; gap: 3px; }
  .stat-compact-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; transition: background 0.15s; }
  .stat-compact-row:hover { background: var(--bg-hover); }
  .stat-compact-icon { font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; }
  .stat-compact-name { font-size: 13px; font-weight: 500; color: var(--text-1); min-width: 48px; }
  .stat-compact-lv { font-family: "Geist Mono", ui-monospace, monospace; font-size: 12px; color: var(--text-3); white-space: nowrap; }
  .stat-compact-lv strong { font-size: 15px; font-weight: 700; color: var(--accent); }
  .stat-compact-bar { flex: 1; height: 3px; background: var(--bg-3); border-radius: 999px; overflow: hidden; }
  .stat-compact-fill { height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: 999px; transition: width 0.9s cubic-bezier(0.2,0.7,0.2,1); }
  .stat-expand-inline { margin: 0 10px 6px; padding: 12px 14px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; animation: bodyIn 0.22s ease; }

  /* Diablo stats */
  .diablo-wrap { background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 24px; }
  .diablo-row { display: flex; align-items: center; gap: 14px; padding: 12px 18px; cursor: pointer; transition: background 0.15s; border-bottom: 1px solid var(--border); }
  .diablo-row:last-of-type { border-bottom: none; }
  .diablo-row:hover { background: var(--bg-2); }
  .diablo-icon { font-size: 17px; width: 24px; text-align: center; flex-shrink: 0; }
  .diablo-name { font-size: 13.5px; font-weight: 500; color: var(--text-1); min-width: 60px; }
  .diablo-desc { font-size: 11.5px; color: var(--text-4); flex: 1; }
  .diablo-xp-mini { width: 80px; height: 3px; background: var(--bg-3); border-radius: 999px; overflow: hidden; }
  .diablo-xp-mini-fill { height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: 999px; }
  .diablo-lv-wrap { display: flex; align-items: baseline; gap: 3px; }
  .diablo-lv { font-family: "Geist Mono", ui-monospace, monospace; font-size: 22px; font-weight: 700; color: var(--accent); letter-spacing: -0.03em; line-height: 1; }
  .diablo-lv-lbl { font-family: "Geist Mono", ui-monospace, monospace; font-size: 9.5px; color: var(--text-4); text-transform: uppercase; letter-spacing: 0.06em; }

      const r = (size - stroke) / 2;
      const c = 2 * Math.PI * r;
      const [shown, setShown] = useState(0);
      useEffect(() => {
        const id = requestAnimationFrame(() => setShown(value));
        return () => cancelAnimationFrame(id);
      }, [value]);
      const offset = c - (shown / 100) * c;
      return (
        <div className="ring-wrap" style={{ width: size, height: size }}>
          <svg viewBox={`0 0 ${size} ${size}`}>
            <circle className="ring-bg" cx={size/2} cy={size/2} r={r} />
            <circle

              cx={size/2} cy={size/2} r={r}
              strokeDasharray={c}
              strokeDashoffset={offset}
            />
          </svg>
          <div className="ring-label">
            <span>{Math.round(shown)}</span><span className="pct">%</span>
          </div>
        </div>
      );
    }

    /* ---------- Radar Chart ---------- */
    function RadarChart({ stats, size = 200 }) {
      const cx = size / 2, cy = size / 2;
      const R = size * 0.36;
      const n = stats.length;
      const angles = Array.from({length: n}, (_, i) => (i * 2 * Math.PI / n) - Math.PI / 2);
      const pt = (a, r) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
      const toPoints = pts => pts.map(p => p.join(',')).join(' ');
      const levels = [0.25, 0.5, 0.75, 1.0];
      const dataPts = stats.map((s, i) => pt(angles[i], (s.xp / 100) * R));
      const labelPts = angles.map((a, i) => pt(a, R + 24));
      return (
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
          {levels.map((l, li) => (
            <polygon key={li} points={toPoints(angles.map(a => pt(a, R * l)))}
              fill="none"
              stroke={li === 3 ? "rgba(255,255,255,0.1)" : "rgba(255,255,255,0.04)"}
              strokeWidth={li === 3 ? 1.5 : 1} />
          ))}
          {angles.map((a, i) => {
            const [x, y] = pt(a, R);
            return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="rgba(255,255,255,0.06)" strokeWidth="1"/>;
          })}
          <polygon points={toPoints(dataPts)}
            fill="rgba(139,92,246,0.18)" stroke="rgba(139,92,246,0.8)"
            strokeWidth="2" strokeLinejoin="round" />
          {dataPts.map(([x, y], i) => (
            <circle key={i} cx={x} cy={y} r="4" fill="#8b5cf6" stroke="var(--bg-1)" strokeWidth="2"/>
          ))}
          {labelPts.map(([x, y], i) => (
            <text key={i} x={x} y={y} textAnchor="middle" dominantBaseline="middle" fontSize="15" style={{userSelect:'none'}}>
              {stats[i].icon}
            </text>
          ))}
        </svg>
      );
    }

    function Calendar() {
      const today = 20;
      const month = 5;
      const year = 2026;
      const firstDay = new Date(year, month - 1, 1).getDay(); // 0 sun
      const daysInMonth = new Date(year, month, 0).getDate();
      const prevDays = new Date(year, month - 1, 0).getDate();

      const weekDays = ["일", "월", "화", "수", "목", "금", "토"];
      const cells = [];
      // leading
      for (let i = 0; i < firstDay; i++) {
        cells.push({ d: prevDays - firstDay + i + 1, muted: true });
      }
      for (let d = 1; d <= daysInMonth; d++) {
        cells.push({ d, muted: false, today: d === today, hasEvent: [5, 8, 12, 18, 22, 25].includes(d),
                     inWeek: d >= 18 && d <= 24 });
      }
      while (cells.length % 7 !== 0) {
        const last = cells[cells.length - 1];
        cells.push({ d: cells.length - daysInMonth - firstDay + 1, muted: true });
      }

      return (
        <div className="card card-pad">
          <div className="cal-head">
            <div className="cal-month">2026년 5월</div>
            <div className="cal-nav">
              <button>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <button>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            </div>
          </div>
          <div className="cal-grid">
            {weekDays.map((w, i) => <div key={i} className="cal-head-cell">{w}</div>)}
            {cells.map((c, i) => (
              <div
                key={i}
                className={
                  "cal-cell" +
                  (c.muted ? " muted" : "") +
                  (c.today ? " today" : "") +
                  (c.hasEvent ? " has-event" : "") +
                  (c.inWeek && !c.today ? " in-week" : "")
                }
              >
                {c.d}
              </div>
            ))}
          </div>
          <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid var(--border)", display: "flex", gap: 14, fontSize: 11, color: "var(--text-3)" }}>
            <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ width: 8, height: 8, borderRadius: 4, background: "linear-gradient(135deg, var(--accent), var(--accent-2))" }}/> 오늘
            </span>
            <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ width: 8, height: 8, borderRadius: 4, background: "rgba(139,92,246,0.15)" }}/> 이번 주
            </span>
            <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ width: 4, height: 4, borderRadius: 999, background: "var(--accent)" }}/> 일정 있음
            </span>
          </div>
        </div>
      );
    }

    /* ---------- App ---------- */
    function App({ user }) {
      const [tab, setTab] = useState("dashboard");
      const [goals] = useState(INITIAL_GOALS);
      const [tasks, setTasks] = useState(INITIAL_TASKS);
      const [weeklyGoals, setWeeklyGoals] = useState(INITIAL_WEEKLY_GOALS);
      const [stats, setStats] = useState(INITIAL_STATS);
      const [retros, setRetros] = useState(INITIAL_RETROS);
      const [vision, setVision] = useState(INITIAL_VISION);
      const [dreams, setDreams] = useState(INITIAL_DREAMS);
      const [nextWeekGoals, setNextWeekGoals] = useState(INITIAL_NEXT_WEEKLY_GOALS);
      const [streak, setStreak] = useState(INITIAL_STREAK);
      const [loaded, setLoaded] = useState(false);
      const saveTimer = useRef(null);

      // Firestore에서 데이터 로드
      useEffect(() => {
        _db.collection("users").doc(user.uid).get().then(doc => {
          if (doc.exists) {
            const d = doc.data();
            if (d.tasks) setTasks(d.tasks);
            if (d.weeklyGoals) setWeeklyGoals(d.weeklyGoals);
            if (d.stats) setStats(d.stats);
            if (d.retros) setRetros(d.retros);
            if (d.vision) setVision(d.vision);
            if (d.dreams) setDreams(d.dreams);
            if (d.nextWeekGoals) setNextWeekGoals(d.nextWeekGoals);
            if (d.streak) setStreak(d.streak);
          }
          setLoaded(true);
        });
      }, [user.uid]);

      // 변경 시 1.5초 후 Firestore에 저장 (debounce)
      useEffect(() => {
        if (!loaded) return;
        clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(() => {
          _db.collection("users").doc(user.uid).set(
            { tasks, weeklyGoals, stats, retros, vision, dreams, nextWeekGoals, streak }
          );
        }, 1500);
      }, [tasks, weeklyGoals, stats, retros, vision, dreams, nextWeekGoals, streak, loaded]);

      const toggleTask = (id) => {
        setTasks(prev => prev.map(t => t.id === id ? { ...t, done: !t.done } : t));
      };
      const toggleWeeklyGoal = (id) => {
        setWeeklyGoals(prev => prev.map(w => w.id === id ? { ...w, done: !w.done } : w));
      };

      // Keyboard nav 1~5
      useEffect(() => {
        const onKey = (e) => {
          if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
          if (e.key === "1") setTab("dashboard");
          if (e.key === "2") setTab("goals");
          if (e.key === "3") setTab("tasks");
          if (e.key === "4") setTab("retro");
          if (e.key === "5") setTab("vision");
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, []);

      if (!loaded) return (
        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--bg-0)', color: 'var(--text-3)', fontFamily: 'Geist, sans-serif', fontSize: 14 }}>
          데이터 불러오는 중...
        </div>
      );

      return (
        <div className="app" data-screen-label={
          tab === "dashboard" ? "01 Dashboard" : tab === "goals" ? "02 Goals" : "03 Tasks"
        }>
          <div className="topbar">
            <div className="brand">
              <div className="brand-mark" />
              <div className="brand-name">Jinboard</div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
              <div className="date-pill">
                <span className="dot" />
                2026 · 05 · 20 · WED
              </div>
              <button onClick={() => _auth.signOut()} style={{ background: 'transparent', border: '1px solid var(--border)', borderRadius: 6, color: 'var(--text-4)', fontSize: 11, padding: '4px 10px', cursor: 'pointer', fontFamily: 'Geist, sans-serif' }}>로그아웃</button>
            </div>
          </div>

          <Tabs active={tab} onChange={setTab} />

          {tab === "dashboard" && <Dashboard goals={goals} tasks={tasks} toggleTask={toggleTask} weeklyGoals={weeklyGoals} toggleWeeklyGoal={toggleWeeklyGoal} stats={stats} dreams={dreams} nextWeekGoals={nextWeekGoals} setNextWeekGoals={setNextWeekGoals} streak={streak} setStreak={setStreak} />}
          {tab === "goals" && <GoalsTab goals={goals} />}
          {tab === "tasks" && <TasksTab tasks={tasks} toggleTask={toggleTask} />}
          {tab === "retro" && <RetroTab retros={retros} setRetros={setRetros} />}
          {tab === "vision" && <VisionTab vision={vision} setVision={setVision} stats={stats} setStats={setStats} dreams={dreams} setDreams={setDreams} />}

          <div className="kbd-hints">
            <span>키보드</span>
            <span><span className="kbd">1</span> 대시보드</span>
            <span><span className="kbd">2</span> 목표 관리</span>
            <span><span className="kbd">3</span> 업무 관리</span>
            <span><span className="kbd">4</span> 회고</span>
            <span><span className="kbd">5</span> 비전 & 성장</span>
            <span style={{ marginLeft: "auto" }}>체크박스를 클릭해 완료 처리하세요</span>
          </div>
        </div>
      );

          <p style={{ color: 'var(--red)', fontSize: 15, fontWeight: 600, margin: 0 }}>접근 권한이 없습니다</p>
          <p style={{ color: 'var(--text-4)', fontSize: 13, margin: 0 }}>허가된 계정으로만 접근 가능합니다</p>
          <button onClick={onLogout} style={{ background: 'var(--bg-2)', border: '1px solid var(--border)', borderRadius: 8, color: 'var(--text-3)', fontSize: 13, padding: '8px 18px', cursor: 'pointer', fontFamily: 'Geist, sans-serif' }}>다른 계정으로 로그아웃</button>
        </div>
      );
    }

    function Root() {
      const [user, setUser] = useState(undefined);

      useEffect(() => {
        _auth.onAuthStateChanged(u => setUser(u || null));
      }, []);

      const signIn = () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        _auth.signInWithPopup(provider);
      };

      if (user === undefined) return (
        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--bg-0)', color: 'var(--text-4)', fontFamily: 'Geist, sans-serif', fontSize: 14 }}>
          로딩 중...
        </div>
      );
      if (!user) return <LoginScreen onLogin={signIn} />;
      if (user.email !== ALLOWED_EMAIL) return <AccessDenied onLogout={() => _auth.signOut()} />;
      return <App user={user} />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
  </script>
</body>
</html>
